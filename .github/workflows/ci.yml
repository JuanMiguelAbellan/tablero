name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tablero
          POSTGRES_PASSWORD: tablero
          POSTGRES_DB: tablero
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tablero" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgres://tablero:tablero@localhost:5432/postgres
      E2E_DATABASE_URL: postgres://tablero:tablero@localhost:5432/tablero_e2e
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: test-results }
